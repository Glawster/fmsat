version: 1

anchors:
  enabled: true
  minimumTextMatch: 0.68
  tabBandYMin: 0.08
  tabBandYMax: 0.24
  instructionTabSplit: 0.18
  underlineBrightness: 170
  # Team Instructions is the location anchor. The two phase labels provide a
  # local scale/orientation anchor, so the modal can be recovered regardless of
  # its desktop position or whether the screenshot has already been cropped.
  instructionAnchorLeftGap: 0.08
  instructionAnchorTopGap: 0.18
  instructionAnchorTabX: 0.022
  instructionAnchorTabY: 0.105
  instructionAnchorTabSeparation: 0.13
  # Whole-screen OCR frequently misses the small modal breadcrumb. Retry only
  # this stable upper-centre area at higher resolution.
  instructionBreadcrumbRegion: {x: 0.15, y: 0.12, width: 0.70, height: 0.24}
  instructionBreadcrumbScale: 3.0
  # Legacy safety fallback only. Normal instruction extraction is anchored from
  # Team Instructions + the two phase labels and must not depend on these
  # whole-screen proportions.
  instructionPanelFallback:
    inPossession: {x: 0.205, topOffset: 0.025, width: 0.590, height: 0.680}
    outOfPossession: {x: 0.205, topOffset: 0.025, width: 0.590, height: 0.490}

# Normalized regions for the two pitches visible in the FM26 Planner "Both"
# Formation capture. These values are data rather than parser constants so a
# skin or resolution-specific profile can replace them after fixture calibration.
phaseRegions:
  inPossession: {x: 0.024, y: 0.218, width: 0.271, height: 0.550}
  outOfPossession: {x: 0.317, y: 0.218, width: 0.271, height: 0.550}

phaseRegionProfiles:
  - name: compactTwoPitch
    maximumAspectRatio: 1.80
    regions:
      inPossession: {x: 0.026, y: 0.227, width: 0.484, height: 0.700}
      outOfPossession: {x: 0.522, y: 0.227, width: 0.474, height: 0.700}
  - name: widePlannerWithSquad
    minimumAspectRatio: 1.80
    regions:
      inPossession: {x: 0.024, y: 0.218, width: 0.271, height: 0.550}
      outOfPossession: {x: 0.317, y: 0.218, width: 0.271, height: 0.550}

tileDetection:
  cannyLow: 35
  cannyHigh: 110
  minimumWidth: 0.06
  maximumWidth: 0.32
  minimumHeight: 0.025
  # Actual FM26 role labels are shallow rectangles. Larger contours are player
  # cards, goal-box chrome or other Planner UI and must never become role tiles.
  maximumHeight: 0.08
  # Role labels are strongly horizontal. Circular player-state icons can have
  # similar saturation and size but are much squarer, so exclude them by shape.
  minimumAspectRatio: 2.50
  minimumInteriorSaturation: 70
  minimumInteriorValue: 82
  goalkeeperXMin: 0.35
  goalkeeperXMax: 0.65
  goalkeeperYMin: 0.86
  goalkeeperMinimumInteriorSaturation: 15
  excludedRegions:
    # The calibrated pitch top can still clip the phase tabs into the crop.
    # Reject that shallow chrome band across the full pitch width.
    - {x: 0.00, y: 0.00, width: 1.00, height: 0.055}
    # Eye/dropdown control at the upper-left of each pitch.
    - {x: 0.00, y: 0.00, width: 0.20, height: 0.16}
    # Phase-name badge at the lower-left of each pitch.
    - {x: 0.00, y: 0.90, width: 0.25, height: 0.10}

linking:
  maximumDistance: 0.38
  ambiguityMargin: 0.05
  orderWeight: 0.08

pitchZones:
  bands:
    - yMin: 0.00
      yMax: 0.18
      positions:
        - {xMin: 0.00, xMax: 0.38, code: STCL}
        - {xMin: 0.38, xMax: 0.62, code: STC}
        - {xMin: 0.62, xMax: 1.01, code: STCR}
    - yMin: 0.18
      yMax: 0.38
      positions:
        - {xMin: 0.00, xMax: 0.20, code: AML}
        - {xMin: 0.20, xMax: 0.42, code: AMCL}
        - {xMin: 0.42, xMax: 0.58, code: AMC}
        - {xMin: 0.58, xMax: 0.80, code: AMCR}
        - {xMin: 0.80, xMax: 1.01, code: AMR}
    - yMin: 0.38
      yMax: 0.58
      positions:
        - {xMin: 0.00, xMax: 0.20, code: ML}
        - {xMin: 0.20, xMax: 0.42, code: MCL}
        - {xMin: 0.42, xMax: 0.58, code: MC}
        - {xMin: 0.58, xMax: 0.80, code: MCR}
        - {xMin: 0.80, xMax: 1.01, code: MR}
    - yMin: 0.58
      yMax: 0.72
      positions:
        - {xMin: 0.00, xMax: 0.18, code: WBL}
        - {xMin: 0.18, xMax: 0.42, code: DMCL}
        - {xMin: 0.42, xMax: 0.58, code: DM}
        - {xMin: 0.58, xMax: 0.82, code: DMCR}
        - {xMin: 0.82, xMax: 1.01, code: WBR}
    - yMin: 0.72
      yMax: 0.90
      positions:
        - {xMin: 0.00, xMax: 0.20, code: DL}
        - {xMin: 0.20, xMax: 0.42, code: DCL}
        - {xMin: 0.42, xMax: 0.58, code: DC}
        - {xMin: 0.58, xMax: 0.80, code: DCR}
        - {xMin: 0.80, xMax: 1.01, code: DR}
    - yMin: 0.90
      yMax: 1.01
      positions:
        - {xMin: 0.00, xMax: 1.01, code: GK}

selection:
  mode: displayedValue
  minimumSaturation: 45
  minimumScore: 0.25
  minimumMargin: 0.12
  padding: 5

