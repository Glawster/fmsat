version: 1

anchors:
  enabled: true
  minimumTextMatch: 0.68
  tabBandYMin: 0.08
  tabBandYMax: 0.24
  instructionTabSplit: 0.18
  underlineBrightness: 170

# Normalized regions for the two pitches visible in the FM26 Planner "Both"
# Formation capture. These values are data rather than parser constants so a
# skin or resolution-specific profile can replace them after fixture calibration.
phaseRegions:
  # FM26 Planner "Both" view, normalized to the tactic-window capture. These
  # are deliberately independent of the window's position on the desktop.
  inPossession: {x: 0.024, y: 0.218, width: 0.271, height: 0.550}
  outOfPossession: {x: 0.317, y: 0.218, width: 0.271, height: 0.550}

tileDetection:
  cannyLow: 35
  cannyHigh: 110
  minimumWidth: 0.06
  maximumWidth: 0.32
  minimumHeight: 0.025
  maximumHeight: 0.16
  minimumAspectRatio: 1.45
  minimumInteriorSaturation: 70
  minimumInteriorValue: 82

linking:
  maximumDistance: 0.38
  ambiguityMargin: 0.05
  orderWeight: 0.08

# Pitch y increases from the attacking goal towards the defending goal.
pitchZones:
  bands:
    - yMin: 0.00
      yMax: 0.18
      positions:
        - {xMin: 0.00, xMax: 0.38, code: STCL}
        - {xMin: 0.38, xMax: 0.62, code: STC}
        - {xMin: 0.62, xMax: 1.01, code: STCR}
    - yMin: 0.18
      yMax: 0.38
      positions:
        - {xMin: 0.00, xMax: 0.20, code: AML}
        - {xMin: 0.20, xMax: 0.42, code: AMCL}
        - {xMin: 0.42, xMax: 0.58, code: AMC}
        - {xMin: 0.58, xMax: 0.80, code: AMCR}
        - {xMin: 0.80, xMax: 1.01, code: AMR}
    - yMin: 0.38
      yMax: 0.58
      positions:
        - {xMin: 0.00, xMax: 0.20, code: ML}
        - {xMin: 0.20, xMax: 0.42, code: MCL}
        - {xMin: 0.42, xMax: 0.58, code: MC}
        - {xMin: 0.58, xMax: 0.80, code: MCR}
        - {xMin: 0.80, xMax: 1.01, code: MR}
    - yMin: 0.58
      yMax: 0.72
      positions:
        - {xMin: 0.00, xMax: 0.18, code: WBL}
        - {xMin: 0.18, xMax: 0.42, code: DMCL}
        - {xMin: 0.42, xMax: 0.58, code: DM}
        - {xMin: 0.58, xMax: 0.82, code: DMCR}
        - {xMin: 0.82, xMax: 1.01, code: WBR}
    - yMin: 0.72
      yMax: 0.90
      positions:
        - {xMin: 0.00, xMax: 0.20, code: DL}
        - {xMin: 0.20, xMax: 0.42, code: DCL}
        - {xMin: 0.42, xMax: 0.58, code: DC}
        - {xMin: 0.58, xMax: 0.80, code: DCR}
        - {xMin: 0.80, xMax: 1.01, code: DR}
    - yMin: 0.90
      yMax: 1.01
      positions:
        - {xMin: 0.00, xMax: 1.01, code: GK}

selection:
  # The FM26 Team Instructions overview modal displays exactly one current
  # value per card.  The displayed value is therefore the selection evidence;
  # card colour is not a reliable selected/unselected discriminator.
  mode: displayedValue
  minimumSaturation: 45
  minimumScore: 0.25
  minimumMargin: 0.12
  padding: 5

# Each crop contains one labelled instruction card. OCR geometry plus coloured
# selection evidence determines which displayed value, if any, is persisted.
instructionRegions:
  inPossession:
    passingDirectness: {x: 0.212, y: 0.275, width: 0.088, height: 0.171}
    tempo: {x: 0.309, y: 0.275, width: 0.088, height: 0.171}
    timeWasting: {x: 0.407, y: 0.275, width: 0.088, height: 0.171}
    attackingTransition: {x: 0.505, y: 0.275, width: 0.088, height: 0.171}
