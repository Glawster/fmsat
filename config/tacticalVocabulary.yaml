instructions:
  inPossession:
    passingDirectness: [much shorter, shorter, standard, more direct, much more direct]
    tempo: [much lower, lower, standard, higher, much higher]
    timeWasting: [never, sometimes, frequently]
    attackingTransition: [hold shape, counter]
    attackingWidth: [very narrow, narrow, standard, wide, very wide]
    playForSetPieces: ['false', 'true']
    creativeFreedom: [be more disciplined, balanced, be more expressive]
    buildUpStrategy: [play out of defence]
    goalKicks: [short, mixed, long]
    goalkeeperDistribution: [centre backs, full backs, flanks, playmaker, target forward]
    supportingRuns: [underlap left, underlap right, overlap left, overlap right]
    dribbling: [dribble less, balanced, run at defence]
    progressThrough: [left, centre, right]
    passReception: [to feet, into space]
    patience: [work ball into box]
    shotsFromDistance: [shoot on sight]
    crossingStyle: [low, mixed, floated, whipped]
    goalkeeperDistributionSpeed: [slow pace down, distribute quickly]
  outOfPossession:
    lineOfEngagement: [low block, mid block, high press]
    defensiveLine: [much lower, lower, standard, higher, much higher]
    triggerPress: [much less often, less often, standard, more often, much more often]
    defensiveTransition: [regroup, counter press]
    tackling: [stay on feet, balanced, get stuck in]
    crossEngagement: [stop crosses, invite crosses]
    pressingTrap: [outside, inside]
    shortGoalkeeperDistribution: ['false', 'true']
    defensiveLineBehaviour: [drop off more, step up more]
