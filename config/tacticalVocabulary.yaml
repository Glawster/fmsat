version: 1

duties:
  DEFEND: [defend, def, d]
  SUPPORT: [support, sup, s]
  ATTACK: [attack, att, a]
  AUTOMATIC: [automatic, auto]
  NONE: [none]

positions:
  GK: [goalkeeper]
  DR: [right defender, right back]
  DCR: [right centre back]
  DC: [centre back, central defender, d (c), d(c)]
  DCL: [left centre back]
  DL: [left defender, left back]
  WBR: [right wing back]
  DMCR: [right defensive midfielder]
  DM: [defensive midfielder]
  DMCL: [left defensive midfielder]
  WBL: [left wing back]
  MR: [right midfielder]
  MCR: [right central midfielder]
  MC: [central midfielder, m (c)]
  MCL: [left central midfielder]
  ML: [left midfielder]
  AMR: [right attacking midfielder]
  AMCR: [right central attacking midfielder]
  AMC: [attacking midfielder, am (c), am(c)]
  AMCL: [left central attacking midfielder]
  AML: [left attacking midfielder]
  STCR: [right striker]
  STC: [striker, centre forward]
  STCL: [left striker]

