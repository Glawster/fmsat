  ballPlayingGoalkeeper:
    attributeWeights: {handling: 10, reflexes: 10, one_on_ones: 8, aerial_reach: 6, command_of_area: 6, communication: 6, passing: 8, kicking: 8, decisions: 6, composure: 6, agility: 6, positioning: 6}
