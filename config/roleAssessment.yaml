version: 1
identity: fm26-generic-role-fit-v1

# All findings use Generic Role Fit only. They must not be described as tactical
# suitability, player assignment, Best XI selection or recruitment advice.
weakRoleFitThreshold: 60.0
duplicationFitThreshold: 60.0
duplicationMinimumPlayers: 3
unusedStrengthThreshold: 60.0
alternativeRoleLimit: 3

# Required Role Depth combines the phase-specific Generic Role Fit evidence with
# an explicit equal-weight arithmetic mean. Missing evidence remains Unavailable.
slotAggregationPolicy: phaseMean

# Weight scale: 5 essential, 4 very important, 3 important, 2 useful, 1 minor.
# Omitted attributes do not participate in the calculation.
