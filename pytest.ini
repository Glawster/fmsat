[pytest]
testpaths = tests
python_files = test_[a-z]*.py
python_functions = test*
python_classes = Test*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -m "not expensive"
markers =
    expensive: real OCR, golden-evidence, or clean-room production-path coverage
filterwarnings = 
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
