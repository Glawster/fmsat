[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmsat"
version = "0.1.0"
description = "Football Manager Squad Assessment Tool"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  {name = "Andy Wilson", email = "murky_oblong0s@icloud.com"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.8",
  "organiseMyProjects",
  "paddleocr>=2.7",
  "PySide6>=6.6",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
compression = [
  "lz4>=4.3",
  "zstandard>=0.22",
]
bundles = [
  "UnityPy>=1.10",
]
dev = [
  "black>=24.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
fmsat = "fmsat.main:main"

[tool.setuptools]
packages = [
  "fmsat",
  "fmsat.app",
  "fmsat.config",
  "fmsat.core",
  "fmsat.core.images",
  "fmsat.core.ocr",
  "fmsat.core.parser",
  "fmsat.core.validation",
  "fmsat.database",
]
package-dir = {fmsat = "."}
include-package-data = true

[tool.setuptools.package-data]
fmsat = [
  "config/*.yaml",
  "config/roleProfiles/*.yaml",
]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
